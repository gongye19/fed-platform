[project]
name = "fedplat"
version = "0.7.0"
description = "FedAgent platform kernel: protocol, registry, plugin socket"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.82",
    "deepseek-harness-sdk==0.1.1rc1",
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.4",
    "psycopg[binary]==3.3.4",
    "python-multipart==0.0.32",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
fed-migrate = "fedplat.migrate:main"
fed-worker = "fedplat.worker:main"

[tool.setuptools.packages.find]
include = ["fedplat*"]

[tool.setuptools.package-data]
fedplat = ["dsh/*.yml", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
